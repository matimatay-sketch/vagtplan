<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Turnus – ingen forbindelse</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf8f4;
        --fg: #141a2e;
        --muted: #4b5563;
        --primary: #3340a8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10131f;
          --fg: #f3f4f6;
          --muted: #c2c7d0;
          --primary: #8f9bff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.375rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      button {
        min-height: 48px;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--fg);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ingen forbindelse</h1>
      <p>Turnus kan ikke nå serveren. Tjek dit netværk og prøv igen.</p>
      <button type="button" id="retry">Prøv igen</button>
    </main>
    <script>
      // The server address is written in by scripts/write-www.mjs.
      const retry = () => location.replace("__TURNUS_APP_URL__");
      document.getElementById("retry").addEventListener("click", retry);
      // Try again by itself when the network returns.
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
